name: Asset registry quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check asset governance and staged-registration rules
        run: npm run assets:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload asset audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: asset-registry-audit
          path: var/asset-audit/
          if-no-files-found: error
