name: Scheduled docs self-review

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  self-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate static review report
        run: npm run docs:self-review -- --since=HEAD~10
      - name: Generate AI review prompt
        run: npm run docs:self-review:prompt
      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-self-review
          path: var/docs-self-review/
          if-no-files-found: error
