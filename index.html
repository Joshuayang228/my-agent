<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';" />
    <title>My Agent</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme')
          var themes = ['dark', 'light', 'mist', 'night-feast', 'green-garden', 'golden', 'blue-pool']
          document.documentElement.dataset.theme = themes.includes(savedTheme || '') ? savedTheme : 'mist'
        } catch {
          document.documentElement.dataset.theme = 'mist'
        }
      })()
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg-primary, #f7f6f2);
        color: var(--text-primary, #1a1714);
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--bg-primary, #f7f6f2);
        color: var(--text-primary, #1a1714);
        opacity: 1;
        transition: opacity 220ms ease;
      }

      #startup-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .startup-splash__content {
        display: grid;
        justify-items: center;
        gap: 10px;
        user-select: none;
      }

      .startup-splash__mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        margin-bottom: 4px;
        border: 1px solid var(--border-color, #ddd6ca);
        border-radius: 14px;
        background: var(--accent-subtle, rgba(139, 115, 85, 0.1));
      }

      .startup-splash__mark::after {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: var(--accent, #8b7355);
        content: '';
      }

      .startup-splash__name {
        font: 600 16px/1.2 var(--font-ui, sans-serif);
        letter-spacing: 0.02em;
      }

      .startup-splash__tagline {
        color: var(--text-secondary, #5a5450);
        font: 13px/1.4 var(--font-ui, sans-serif);
      }

      .startup-splash__loader {
        display: flex;
        gap: 5px;
        margin-top: 8px;
      }

      .startup-splash__loader span {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: var(--accent, #8b7355);
        animation: startup-splash-pulse 1.1s ease-in-out infinite;
      }

      .startup-splash__loader span:nth-child(2) {
        animation-delay: 140ms;
      }

      .startup-splash__loader span:nth-child(3) {
        animation-delay: 280ms;
      }

      @keyframes startup-splash-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-splash {
          transition-duration: 0ms;
        }

        .startup-splash__loader span {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-live="polite">
      <div class="startup-splash__content">
        <div class="startup-splash__mark" aria-hidden="true"></div>
        <div class="startup-splash__name">My Agent</div>
        <div class="startup-splash__tagline">正在准备你的空间</div>
        <div class="startup-splash__loader" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById('startup-splash')
        var root = document.getElementById('root')
        if (!splash || !root) return

        var hide = function () {
          if (!splash.isConnected) return
          splash.classList.add('is-hidden')
          window.setTimeout(function () {
            splash.remove()
          }, 240)
        }

        if (root.childElementCount > 0) {
          window.requestAnimationFrame(hide)
          return
        }

        var observer = new MutationObserver(function () {
          if (root.childElementCount === 0) return
          observer.disconnect()
          window.requestAnimationFrame(hide)
        })
        observer.observe(root, { childList: true })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
